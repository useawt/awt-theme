name: Bug report
description: Something in the theme does not work or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe what you saw. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page address
      description: A public page where we can see the problem, if you have one.
  - type: input
    id: theme-version
    attributes:
      label: AWT theme version
      description: Appearance > Themes > AWT shows it.
      placeholder: "2026.09.41"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Firefox 131 on Windows 11"
